<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: stylized circuit/shield shape -->
  <g transform="translate(4, 4)">
    <!-- Outer shield -->
    <path d="M20 0 L38 6 L38 24 Q38 38 20 40 Q2 38 2 24 L2 6 Z"
          fill="none" stroke="url(#glow)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Inner circuit pattern -->
    <line x1="12" y1="14" x2="20" y2="14" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <line x1="12" y1="26" x2="20" y2="26" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="20" x2="34" y2="20" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

    <!-- Mini NAND gate -->
    <path d="M18 11 L18 29 Q26 29 26 20 Q26 11 18 11 Z"
          fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.5"/>

    <!-- NOT bubble -->
    <circle cx="28" cy="20" r="2.5" fill="#0a0a0a" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Bolt (keeper symbol) -->
    <path d="M19 16 L17 20.5 L21 20.5 L19 25" stroke="#facc15" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Input dots -->
    <circle cx="11" cy="14" r="1.8" fill="#22c55e"/>
    <circle cx="11" cy="26" r="1.8" fill="#22c55e"/>
    <!-- Output dot -->
    <circle cx="35" cy="20" r="1.8" fill="#22c55e"/>
  </g>

  <!-- Text -->
  <text x="52" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="-0.5">
    Circuit
  </text>
  <text x="52" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#22c55e" letter-spacing="-0.5">
    Keeper
  </text>
</svg>
